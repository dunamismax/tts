<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audiobook Studio</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M18 20h10a6 6 0 0 1 6 6v20a4 4 0 0 0-4-4H18zM46 20H36a6 6 0 0 0-6 6' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M40 30v10M45 27v16M50 32v6' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Audiobook<br><b>Studio</b></span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="library"><span class="i" data-icon="library"></span>Library</a>
        <a href="#/voices" data-nav="voices"><span class="i" data-icon="mic"></span>Voices</a>
        <a href="#/pronunciations" data-nav="pronunciations"><span class="i" data-icon="type"></span>Pronunciations</a>
        <a href="#/settings" data-nav="settings"><span class="i" data-icon="sliders"></span>Settings</a>
      </nav>
      <div class="sidebar-spacer"></div>
      <div id="job-card" class="job-card" hidden></div>
      <p class="sidebar-foot">Runs entirely on this Mac.<br>Nothing leaves your computer.</p>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-overlay-inner">
      <span class="i i-xl" data-icon="upload"></span>
      <h2 id="drop-overlay-title">Drop to import</h2>
      <p id="drop-overlay-sub">EPUB, PDF, TXT or Markdown</p>
    </div>
  </div>

  <div id="player" class="player" hidden>
    <div class="player-art" id="player-art"></div>
    <div class="player-meta">
      <div class="player-title" id="player-title"></div>
      <div class="player-sub" id="player-sub"></div>
    </div>
    <div class="player-controls">
      <button class="icon-btn" id="pl-back" title="Back 15 seconds" aria-label="Back 15 seconds"><span class="i" data-icon="back15"></span></button>
      <button class="play-btn" id="pl-play" aria-label="Play"><span class="i" data-icon="play"></span></button>
      <button class="icon-btn" id="pl-fwd" title="Forward 30 seconds" aria-label="Forward 30 seconds"><span class="i" data-icon="fwd30"></span></button>
    </div>
    <div class="player-scrub">
      <span class="t" id="pl-cur">0:00</span>
      <input type="range" id="pl-seek" min="0" max="1000" value="0" aria-label="Seek">
      <span class="t" id="pl-dur">0:00</span>
    </div>
    <button class="chip-btn" id="pl-rate" title="Playback speed">1×</button>
    <button class="icon-btn" id="pl-close" title="Close player" aria-label="Close player"><span class="i" data-icon="x"></span></button>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
